name: Real Estate Agent

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check required keys
        id: keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          missing=""
          for n in ANTHROPIC_API_KEY; do
            [ "${!n}" = "true" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping this cycle, repo secrets not set:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.keys.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Run agent cycle
        if: steps.keys.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          AGENT_NAME: ${{ vars.AGENT_NAME || 'Alex' }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME || 'Premier Realty' }}
          MARKET_AREA: ${{ vars.MARKET_AREA || 'your area' }}
          AGENT_PHONE: ${{ vars.AGENT_PHONE || '' }}
        run: python -m agent.realestate.main --mode scheduled

      - name: Export pipeline to portal JSON
        if: steps.keys.outputs.ready == 'true'
        env:
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python -m agent.realestate.export

      - name: Commit state and portal back
        if: steps.keys.outputs.ready == 'true'
        run: |
          git config user.name "re-agent[bot]"
          git config user.email "re-agent@noreply"
          git add state/re_memory.json state/re_journal.jsonl docs/re_leads.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(re-agent): cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
