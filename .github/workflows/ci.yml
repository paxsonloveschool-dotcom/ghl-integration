name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compile-check
        run: python -m compileall -q agent/

      - name: Import smoke test
        env:
          # Stub creds so import-time checks don't bail.
          ANTHROPIC_API_KEY: dummy
        run: python -c "import agent.main, agent.brain, agent.tools, agent.ghl, agent.memory, agent.prompts; print('imports OK')"

      - name: Workflow YAML validation
        run: |
          python -c "import yaml; yaml.safe_load(open('.github/workflows/agent.yml'))"
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"
