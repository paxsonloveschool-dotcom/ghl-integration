name: hp-site

# Self-hosted H&P Landscaping website.
#   cp .env.example .env   # then set SITE_DOMAIN
#   docker compose up -d
#
# Caddy serves ../../site over HTTP/HTTPS and auto-manages TLS certificates.
# The site is bind-mounted read-only, so `git pull` on this host updates the
# live site immediately — no rebuild.

services:
  web:
    image: caddy:2-alpine
    container_name: hp-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../site:/srv:ro
      - caddy_data:/data        # certificates (persist across restarts!)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
